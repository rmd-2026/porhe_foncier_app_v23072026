        numeroPieceIdentite: $numeroPieceIdentite, pieceIdentiteValideDe: $pieceIdentiteValideDe,
        pieceIdentiteValideA: $pieceIdentiteValideA, telephone: $telephone, adresse: $adresse, photoUrl: $photoUrl,
        updatedAt_expr: "request.time"
    })
}

# ==========================================================
# 2. RBAC — UtilisateurRole
# ==========================================================

mutation assignerRoleUtilisateurParDefaut($utilisateurId: Int!) @auth(level: USER) {
  utilisateurRole_upsert(data: { utilisateurId: $utilisateurId, nomRole: PROPRIETAIRE, communeId: null, updatedAt_expr: "request.time" })
}

mutation assignerRoleGlobal($utilisateurId: Int!, $nomRole: NomRole!) @auth(level: USER) {
  utilisateurRole_upsert(data: { utilisateurId: $utilisateurId, nomRole: $nomRole, communeId: null, updatedAt_expr: "request.time" })
}

mutation assignerRoleCommune($utilisateurId: Int!, $nomRole: NomRole!, $communeId: Int!) @auth(level: USER) {
  utilisateurRole_upsert(data: { utilisateurId: $utilisateurId, nomRole: $nomRole, communeId: $communeId, updatedAt_expr: "request.time" })
}

# Approuve un utilisateur — KYC réussi OU réactivation après désactivation.
# motifStatut toujours effacé (null), quel que soit l'état précédent.
mutation validerUtilisateur($firebaseUid: String!) @auth(level: USER) {
    utilisateur_update(
        key: { firebaseUid: $firebaseUid }
        data: { statutCompte: ACTIF, motifStatut: null, updatedAt_expr: "request.time" }
    )
}

# Désactive un utilisateur — échec KYC OU désactivation manuelle
# ultérieure. Motif obligatoire pour traçabilité, un seul chemin pour
# les deux cas d'usage.
mutation desactiverUtilisateur($firebaseUid: String!, $motifStatut: String!) @auth(level: USER) {
    utilisateur_update(
        key: { firebaseUid: $firebaseUid }
        data: { statutCompte: DESACTIVE, motifStatut: $motifStatut, updatedAt_expr: "request.time" }
    )
}
