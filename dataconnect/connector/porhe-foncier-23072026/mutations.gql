    $email: String, $telephone: String, $adresse: String, $photoUrl: String
) @auth(level: USER) {
    utilisateur_upsert(data: {
        firebaseUid: $firebaseUid, nom: $nom, prenom: $prenom, civilite: $civilite, dateNaissance: $dateNaissance,
        lieuNaissance: $lieuNaissance, nationalite: $nationalite, typePieceIdentite: $typePieceIdentite,
        numeroPieceIdentite: $numeroPieceIdentite, pieceIdentiteValideDe: $pieceIdentiteValideDe,
        pieceIdentiteValideA: $pieceIdentiteValideA, email: $email, telephone: $telephone, adresse: $adresse,
        photoUrl: $photoUrl, updatedAt_expr: "request.time"
    })
}

mutation mettreAJourProfil(
    $firebaseUid: String!, $nom: String, $prenom: String, $civilite: Civilite, $dateNaissance: Date,
    $lieuNaissance: String, $nationalite: String, $typePieceIdentite: TypePieceIdentite,
    $numeroPieceIdentite: String, $pieceIdentiteValideDe: Date, $pieceIdentiteValideA: Date,
    $telephone: String, $adresse: String, $photoUrl: String
) @auth(level: USER) {
    utilisateur_update(key: { firebaseUid: $firebaseUid }, data: {
