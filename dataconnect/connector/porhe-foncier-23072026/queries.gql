        id
        typeTransaction
        montant
        statut
        dateTransaction
    }
}

query listerTransactionsParUtilisateur($utilisateurId: Int!) @auth(level: USER) {
    transactionFoncieres(
        where: {
            _or: [
                { vendeurId: { eq: $utilisateurId } }
                { acheteurId: { eq: $utilisateurId } }
            ]
        }
        orderBy: [{ dateTransaction: DESC }]
    ) {
        id
        parcelleId
        typeTransaction
        montant
        statut
        dateTransaction
