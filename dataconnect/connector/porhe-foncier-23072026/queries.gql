# ==========================================================
# 14. CROSS-CUTTING / AGRÉGATS
# ==========================================================

query obtenirStatistiquesCommune($communeId: Int!) @auth(level: USER) {
    parcelles(where: { communeId: { eq: $communeId } }) {
        id
        statut
    }
    taxeFoncieres(where: { parcelle: { communeId: { eq: $communeId } } }) {
        id
        montantDu
        statut
    }
    transactionFoncieres(where: { parcelle: { communeId: { eq: $communeId } } }) {
        id
        statut
        montant
    }
}

query obtenirChronologieParcelle($parcelleId: Int!) @auth(level: USER) {
    transactionFoncieres(where: { parcelleId: { eq: $parcelleId } }, orderBy: [{ dateTransaction: DESC }]) {
        id
        typeTransaction
        montant
        statut
        dateTransaction
    }
    taxeFoncieres(where: { parcelleId: { eq: $parcelleId } }, orderBy: [{ anneeFiscale: DESC }]) {
        id
        anneeFiscale
        montantDu
        statut
    }
    documentParcelles(where: { parcelleId: { eq: $parcelleId } }, orderBy: [{ createdAt: DESC }]) {
        id
        typeDocument
        nomFichier
        createdAt
    }
    suiviVisuels(where: { parcelleId: { eq: $parcelleId } }, orderBy: [{ createdAt: DESC }]) {
        id
        typeMedia
        urlStockage
        createdAt
    }
    litiges(where: { parcelleId: { eq: $parcelleId } }, orderBy: [{ createdAt: DESC }]) {
        id
        statut
        motif
        createdAt
    }
}
