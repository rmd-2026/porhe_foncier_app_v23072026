query listerParcellesDansZone($latMin: Float!, $latMax: Float!, $lonMin: Float!, $lonMax: Float!) @auth(level: USER) {
    parcelles(where: {
        latitude: { ge: $latMin, le: $latMax }
        longitude: { ge: $lonMin, le: $lonMax }
    }) {
