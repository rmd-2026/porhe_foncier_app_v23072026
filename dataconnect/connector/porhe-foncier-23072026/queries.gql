query obtenirTransactionParId($id: Int!) @auth(level: USER) {
    transactionFonciere(id: $id) {
        id
        parcelleId
        vendeurId
        acheteurId
        typeTransaction
        montant
        statut
        motifRejet
        dateTransaction
        createdAt
        updatedAt
