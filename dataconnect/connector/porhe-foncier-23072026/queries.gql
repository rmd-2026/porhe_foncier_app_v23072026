query listerPaiementsTaxeEnAttenteParCommune($communeId: Int!) @auth(level: USER) {
    paiements(
        where: {
            statut: { eq: EN_ATTENTE }
            taxeFonciereId: { isNull: false }
            taxeFonciere: { parcelle: { communeId: { eq: $communeId } } }
        }
        orderBy: [{ createdAt: ASC }]
    ) {
        id
        utilisateurId
        taxeFonciereId
        methodePaiement
        montant
        referenceTransaction
        createdAt
    }
}

