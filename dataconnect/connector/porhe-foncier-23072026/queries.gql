# ==========================================================
# 0. RÉFÉRENCE — Region / Commune / SousPrefecture
# ==========================================================

query listerRegions @auth(level: PUBLIC) {
    regions(orderBy: [{ id: ASC }]) {
        id
        nom
    }
}

query listerCommunes @auth(level: PUBLIC) {
    communes(orderBy: [{ nom: ASC }]) {
        id
        nom
        regionId
    }
}

query listerCommunesParRegion($regionId: Int!) @auth(level: PUBLIC) {
    communes(where: { regionId: { eq: $regionId } }, orderBy: [{ nom: ASC }]) {
        id
        nom
        regionId
    }
}

query listerSousPrefectures @auth(level: PUBLIC) {
    sousPrefectures(orderBy: [{ nom: ASC }]) {
        id
        nom
        communeId
    }
}

query listerSousPrefecturesParCommune($communeId: Int!) @auth(level: PUBLIC) {
    sousPrefectures(where: { communeId: { eq: $communeId } }, orderBy: [{ nom: ASC }]) {
        id
        nom
        communeId
    }
}

# ==========================================================
# 1. IDENTITÉ — Utilisateur
# ==========================================================

query obtenirProfilParFirebaseUid($firebaseUid: String!) @auth(level: USER) {
    utilisateur(key: { firebaseUid: $firebaseUid }) {
        id
        firebaseUid
        nom
        prenom
        civilite
        dateNaissance
        lieuNaissance
        nationalite
        typePieceIdentite
        numeroPieceIdentite
        pieceIdentiteValideDe
        pieceIdentiteValideA
        email
        telephone
        adresse
        photoUrl
        statutCompte
        motifStatut
        createdAt
        updatedAt
    }
}

query estProfilIncomplet($firebaseUid: String!) @auth(level: USER) {
    utilisateur(key: { firebaseUid: $firebaseUid }) {
        nom
        prenom
        telephone
        adresse
    }
}

query listerUtilisateursParStatutCompte($statutCompte: StatutCompte!) @auth(level: USER) {
    utilisateurs(where: { statutCompte: { eq: $statutCompte } }, orderBy: [{ createdAt: DESC }]) {
        id
        firebaseUid
        nom
        prenom
        email
        telephone
        statutCompte
        motifStatut
        createdAt
    }
}

query obtenirUtilisateurParId($id: Int!) @auth(level: USER) {
    utilisateurs(where: { id: { eq: $id } }) {
        id
        firebaseUid
        nom
        prenom
        email
        telephone
    }
}

query listerTousUtilisateurs($limit: Int = 50, $offset: Int = 0) @auth(level: USER) {
    utilisateurs(orderBy: [{ createdAt: DESC }], limit: $limit, offset: $offset) {
        id
        firebaseUid
        nom
        prenom
        email
        telephone
        statutCompte
        createdAt
    }
}

# ==========================================================
# 2. RBAC — UtilisateurRole
# ==========================================================

query obtenirRoleParUtilisateurId($utilisateurId: Int!) @auth(level: USER) {
    utilisateurRole(key: { utilisateurId: $utilisateurId }) {
        id
        nomRole
        communeId
        createdAt
        updatedAt
    }
}

query verifierAppartenanceCommune($utilisateurId: Int!, $communeId: Int!) @auth(level: USER) {
    utilisateurRoles(where: {
        _and: [
            { utilisateurId: { eq: $utilisateurId } }
            {
                _or: [
                    { nomRole: { eq: ADMIN_GLOBAL } }
                    { communeId: { eq: $communeId } }
                ]
            }
        ]
    }) {
        nomRole
        communeId
    }
}

# ==========================================================
# 3. AUDIT / HISTORIQUE — JournalAudit
# ==========================================================

query listerAuditToutes($limit: Int = 50, $offset: Int = 0) @auth(level: USER) {
    journalAudits(orderBy: [{ createdAt: DESC }], limit: $limit, offset: $offset) {
        id
        typeEntite
        entiteId
        action
        motif
        acteurFirebaseUid
        communeId
        donneesAvant
        donneesApres
        createdAt
    }
}

query listerAuditParActeur($acteurFirebaseUid: String!) @auth(level: USER) {
    journalAudits(where: { acteurFirebaseUid: { eq: $acteurFirebaseUid } }, orderBy: [{ createdAt: DESC }]) {
        id
        typeEntite
        entiteId
        action
        motif
        communeId
        createdAt
    }
}

query listerAuditParCommune($communeId: Int!) @auth(level: USER) {
    journalAudits(where: { communeId: { eq: $communeId } }, orderBy: [{ createdAt: DESC }]) {
        id
        typeEntite
        entiteId
        action
        motif
        acteurFirebaseUid
        donneesAvant
        donneesApres
        createdAt
    }
}

query listerAuditParTypeEntite($typeEntite: String!) @auth(level: USER) {
    journalAudits(where: { typeEntite: { eq: $typeEntite } }, orderBy: [{ createdAt: DESC }]) {
        id
        entiteId
        action
        motif
        acteurFirebaseUid
        communeId
        createdAt
    }
}

query listerHistoriqueRejetsEtSuppressions($communeId: Int, $limit: Int = 50, $offset: Int = 0) @auth(level: USER) {
    journalAudits(
        where: {
            _and: [
                { communeId: { eq: $communeId } }
                {
                    _or: [
                        { action: { eq: "REJET" } }
                        { action: { eq: "SUPPRESSION" } }
                        { action: { eq: "ANNULATION" } }
                    ]
                }
            ]
        }
        orderBy: [{ createdAt: DESC }]
        limit: $limit
        offset: $offset
    ) {
        id
        typeEntite
        entiteId
        action
        motif
        acteurFirebaseUid
        communeId
        donneesAvant
        createdAt
    }
}

# ==========================================================
# 4. PARCELLE
# ==========================================================

query obtenirParcelleParId($id: Int!) @auth(level: USER) {
    parcelle(id: $id) {
        id
        codeParcelle
        utilisateurId
        regionId
        communeId
        sousPrefectureId
        superficieM2
        latitude
        longitude
        adresseTerrain
        qrCode
        statut
        motifRejet
        createdAt
        updatedAt
    }
}

query obtenirParcelleParQrCode($qrCode: String!) @auth(level: USER) {
    parcelles(where: { qrCode: { eq: $qrCode } }) {
        id
        codeParcelle
        utilisateurId
        communeId
        statut
    }
}

query listerParcellesParUtilisateur($utilisateurId: Int!) @auth(level: USER) {
    parcelles(where: { utilisateurId: { eq: $utilisateurId } }, orderBy: [{ createdAt: DESC }]) {
        id
        codeParcelle
        communeId
        superficieM2
        statut
        createdAt
    }
}

query listerParcellesParCommune($communeId: Int!, $limit: Int = 50, $offset: Int = 0) @auth(level: USER) {
    parcelles(where: { communeId: { eq: $communeId } }, orderBy: [{ createdAt: DESC }], limit: $limit, offset: $offset) {
        id
        codeParcelle
        utilisateurId
        superficieM2
        statut
        createdAt
    }
}

query listerParcellesParStatut($communeId: Int!, $statut: StatutParcelle!) @auth(level: USER) {
    parcelles(where: { communeId: { eq: $communeId }, statut: { eq: $statut } }, orderBy: [{ createdAt: DESC }]) {
        id
        codeParcelle
        utilisateurId
        communeId
        superficieM2
        statut
        createdAt
        updatedAt
    }
}

query listerParcellesRejeteesParCommune($communeId: Int!) @auth(level: USER) {
    parcelles(where: { communeId: { eq: $communeId }, statut: { eq: REJETEE } }, orderBy: [{ updatedAt: DESC }]) {
        id
        codeParcelle
