    abonnements(where: { utilisateurId: { eq: $utilisateurId }, statut: { eq: ACTIF } }, orderBy: [{ dateDebut: DESC }], limit: 1) {
        niveau
    }
    suiviVisuels(where: { parcelleId: { eq: $parcelleId } }, orderBy: [{ createdAt: DESC }]) {
        id
        typeMedia
        urlStockage
        createdAt
